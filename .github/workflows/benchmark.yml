# Benchmark du détecteur sur le corpus d'annales publiques, déclenché à la main.
# Ne modifie jamais le dépôt : il publie seulement les rapports (artefact), jamais les PDF.
# Les documents non publics (ENSAI) sont absents de l'exécution et signalés comme tels.
name: Benchmark détection

on:
  workflow_dispatch:
    inputs:
      partition:
        description: 'Partition du corpus (dev, test, all)'
        required: true
        default: dev
        type: choice
        options: [dev, test, all]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Rendu raster sous Node (hors dépendances du projet)
        run: npm install --no-save @napi-rs/canvas
      - name: Cache du corpus (PDF téléchargés, jamais publiés)
        uses: actions/cache@v4
        with:
          path: ~/.cache/unspoil-corpus
          key: corpus-${{ hashFiles('src/detection/eval/corpus.tsv') }}
      - name: Benchmark
        run: node scripts/benchmark.mjs ${{ inputs.partition }} --out benchmark-rapports
      - name: Publication des rapports uniquement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.partition }}-${{ github.sha }}
          path: benchmark-rapports/*.md
          retention-days: 30
