# Vérifie chaque Pull Request et chaque mise à jour de main.
# Ce workflow ne modifie jamais le dépôt (lecture seule).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatage (corriger avec npm run format)
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
