# Publie main sur GitHub Pages. Désactivé tant que la variable DEPLOY_PAGES ne vaut pas "true".
# Pour l'activer (voir README, section Déploiement) :
#   1. Settings > Pages > Source : GitHub Actions
#      (GitHub Pages gratuit uniquement pour un dépôt public, ou avec GitHub Pro).
#   2. Settings > Secrets and variables > Actions > Variables : DEPLOY_PAGES = true
# Ce workflow publie le site ; il ne modifie jamais le contenu du dépôt.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
